<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sakieffect</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        button.mycolor {
            padding: 6px 15px;
            font-size: 2.5vh;
            margin-left: 0px;
            margin-bottom: 3px;
            border: 2px solid gray;
            background-color: lightgray;
        }

        button.mycolorvacant {
            background: linear-gradient(135deg,
                    var(--color2) 50%,
                    var(--color1) 50%);
        }

        button.colorgrid {
            padding: 3px 15px;
            font-size: 2.5vh;
            margin-left: 0px;
            margin-bottom: 3px;
            border: 2px solid gray;
            background: conic-gradient(var(--color1) 0deg 90deg,
                    var(--color2) 90deg 180deg,
                    var(--color3) 180deg 270deg,
                    var(--color4) 270deg 360deg);
        }

        button.colorchip {
            padding: 3px 8px;
            margin-left: 0px;
            font-size: 2.5vh;
            border: 2px solid gray;
        }

        button.link {
            all: unset;
            color: #06c;
            text-decoration: underline;
            cursor: pointer;
        }

        button.selected {
            border-color: #000;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            touch-action: none;
            border: 1px solid gray;
        }

        .cell {
            border: 0px solid gray;
        }

        .tool-selector input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .tool-selector label {
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid #aaa;
            cursor: pointer;
        }

        .tool-selector input[type="radio"]:checked+label {
            background-color: #ddd;
            border-color: #555;
        }

        .tool-selector input[type="radio"]:focus-visible+label {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }

        label.radio {
            display: inline-block;
            font-size: 2.2vh;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <script type="module" src="effect-script.js"></script>
    <div>
        <input type="file" id="fileInput" accept="image/*">
        <img id="photo" width="300" style="border:3px solid gray">
        <div>
            <h3>Color Modes</h3>
            <p><select id="effectSelect"></select></p>
            <p id="rgbPanel">
                R <input type="number" id="factorR" min="0" step="10" required> %,
                G <input type="number" id="factorG" min="0" step="10" required> %,
                B <input type="number" id="factorB" min="0" step="10" required> %
            </p>
            <p id="cmykPanel">
                C <input type="number" id="factorC" min="0" step="10" required> %,
                M <input type="number" id="factorM" min="0" step="10" required> %,
                Y <input type="number" id="factorY" min="0" step="10" required> %,
                K <input type="number" id="factorK" min="0" step="10" required> %
            </p>
            <p id="hsvlPanel">
                H <input type="number" id="offsetH" min="0" step="10" required> degrees,
                S <input type="number" id="factorS" min="0" step="10" required> %,
                V <input type="number" id="factorV" min="0" step="10" required> %,
                L <input type="number" id="factorL" min="0" step="10" required> %
            </p>
            <p id="grayPanel">
                Brightness <input type="number" id="factorGray" min="0" step="10" required> %
            </p>
            <p id="stepColorPanel">
                Variations <select id="colorStepSelect">
                    <option value="2">~2000K colors</option>
                    <option value="4">~270K colors</option>
                    <option value="8">~36K colors</option>
                    <option value="16" selected>4913 colors</option>
                    <option value="32">729 colors</option>
                    <option value="64">125 colors</option>
                    <option value="128">27 colors</option>
                </select>
            </p>
        </div>
    </div>
    <hr>
    <div>
        <div>After effect</div>
        <canvas id="output" width="600" style="border:3px solid black"></canvas>
    </div>
</body>

</html>
