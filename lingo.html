<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sakilingo</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script type="module" src="lingo-script.js"></script>

</head>

<body>

  <div>
    <label id="countLabel">#0</label>

    <button id="numberButton" class="tiny"><img src="images/arrow-up-right.svg" class="btn3" alt="Jump to"></button>
    <dialog id="numberDialog">
      <form method="dialog">
        <label for="numberInput">Jump to:</label>
        <input type="number" id="numberInput" min="1" max="1" value="1" required>
        <label id="maxNumberLabel">/???</label>
        <button class="tiny" value="cancel">Cancel</button>
        <button class="tiny" value="ok">OK</button>
      </form>
    </dialog>

    <select id="langSelect" style="background-color: var(--color4);" class="separated2">
    </select>

    <textarea readonly id="nextSentenceLabel" rows="3" style="background-color: var(--color4);">
    </textarea>
    <label id="resultLabel" style="display: none;"></label>

    <div class="buttons">
      <button id="micBtn" style="background-color: var(--color1);">
        <img src="images/mic.svg" class="btn1" alt="Mic">
      </button>
      <button id="prevBtn" style="background-color: var(--color2);" class="separated2">
        <img src="images/caret-left.svg" class="btn1" alt="Prev">
      </button>
      <button id="nextBtn" style="background-color: var(--color3);">
        <img src="images/caret-right.svg" class="btn1" alt="Next">
      </button>
    </div>
    <textarea id="textInput" rows="3"></textarea><br>
  </div>

  <div>
    <button id="translateBtn" class="small" style="background-color: var(--color4);">
      <img src="images/translate.svg" class="btn2" alt="Japanese">
    </button>
    <label id="translationLabel"></label>
  </div>

  <hr>
  <form id="readOutForm">
    <div id="accentList" style="display:inline;"></div>
    <button type="submit" class="small" style="background-color: var(--color4);">
      <img src="images/megaphone.svg" class="btn2" alt="Read"></button>

    <!-- If you need to debug the voice selection, uncomment the following style -->
    <select id="voiceSelect" style="visibility: hidden; font-size: 0;"></select>
  </form>

  <a href="" target="sakilingoGoogleTTS" rel="noopener noreferrer" id="readOutByGoogle">
    <!-- Read by Google with American accent -->
  </a>

  <button id="turnOffMicBtn" class="tiny" style="background-color: var(--color1);">
    <img src="images/mic-mute.svg" class="btn3" alt="Turn off Mic"> Turn off Mic
  </button>
  <a href="lingo-howto.html" target="_blank" class="separated2">How to Use</a>

  <table id="tsvTable"></table>
  <div id="correctBubble" class="bubble">Correct! 🎉</div>

</body>

</html>
