<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sakilingo</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script type="module" src="script.js"></script>

</head>

<body>

  <div>
    <label id="countLabel">#0</label>
    <select id="langSelect" style="background-color: var(--color4);">
      <option value="english">English</option>
      <option value="french">French</option>
      <option value="japanese">Japanese</option>
    </select>

    <textarea readonly id="nextSentenceLabel" rows="3" style="background-color: var(--color4);">
    </textarea>
    <label id="resultLabel" style="display: none;"></label>

    <div class="buttons">
      <button id="micBtn" style="background-color: var(--color1);">
        <img src="images/mic.svg" style="width: 64px; height: 32px;" alt="Mic">
      </button>
      <button id="prevBtn" style="background-color: var(--color2);" class="separated">
        <img src="images/caret-left.svg" style="width: 64px; height: 32px;" alt="Prev">
      </button>
      <button id="nextBtn" style="background-color: var(--color3);">
        <img src="images/caret-right.svg" style="width: 64px; height: 32px;" alt="Next">
      </button>
    </div>
    <textarea id="textInput" rows="3"></textarea><br>
  </div>
  <div>
    <button id="translateBtn" class="small" style="background-color: var(--color4);">
      <img src="images/translate.svg" style="width: 48px; height: 20px;" alt="Japanese">
    </button>
    <label id="japaneseLabel"></label>
  </div>

  <hr>
  <form id="readOutForm">
    <label><input type="radio" name="accent" value="US" checked> <img src="images/flag-us.png" class="flag"
        alt="American"></label>
    <label><input type="radio" name="accent" value="GB"> <img src="images/flag-uk.png" class="flag"
        alt="British"></label>
    <label><input type="radio" name="accent" value="AU"> <img src="images/flag-au.png" class="flag"
        alt="Aussie"></label>
    <button type="submit" class="small" style="background-color: var(--color4);"><img src="images/megaphone.svg"
        style="width: 48px; height: 20px;" alt="Read"></button>
  </form>

  <a href="" target="sakilingoGoogleTTS" rel="noopener noreferrer" id="readOutByGoogle">
    <!-- Read by Google with American accent -->
  </a>

  <button id="abortMicBtn" class="small" style="background-color: var(--color1);">
    <img src="images/mic-mute.svg" style="width: 48px; height: 20px;" alt="Abort Mic">
  </button>

  <table id="tsvTable"></table>
  <div id="correctBubble" class="bubble">Correct! 🎉</div>

</body>

</html>
