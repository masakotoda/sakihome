<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sakilingo</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script type="module" src="script.js"></script>
  <style>
    :root {
      --scale: 1;
    }

    @media (max-width: 768px) {
      :root {
        --scale: 1.3;
      }
    }

    body {
    font-size: calc(16px * var(--scale));
      padding: 10px;
    }

    button {
      padding: 3px;
      margin-left: 10px;
      font-size: 36px;
      border: 4px solid gray;
    }
    button.small {
      padding: 3px;
      margin-left: 10px;
      font-size: 20px;
      border: 4px solid gray;
    }
    button:focus {
      border-color: #000;
    }
    .flag {
      width: calc(48px * var(--scale));
      height: calc(48px * var(--scale));
    }
    textarea {
      width: 100%;
      font-size: 20px;
      line-height: 1.5;
    }
    label {
      font-size: 20px;
    }
    .buttons {
      display: flex;
    }
    .separated {
      margin-left: 30px;
    }
  </style>
</head>

<body>

  <div>
    <textarea id="textInput" rows="3"></textarea><br>
    <label id="resultLabel"></label>
    <label id="countLabel">Counter: 0</label>
    <div class="buttons">
      <button id="micBtn" style="background-color: #A64D79;">
        <img src="images/mic.svg" style="width: 64px; height: 32px;" alt="Mic">
      </button>
      <button id="prevBtn" style="background-color: #C27BA0;" class="separated">
        <img src="images/caret-left.svg" style="width: 64px; height: 32px;" alt="Prev">
      </button>
      <button id="nextBtn" style="background-color: #D5A6BD;">
        <img src="images/caret-right.svg" style="width: 64px; height: 32px;" alt="Next">
      </button>
    </div>
    Next sentence: <label id="nextSentenceLabel"></label> (<label id="japaneseLabel"></label>)<br>
  </div>
  <div>
  </div>
  <form id="readOutForm">
    <label><input type="radio" name="accent" value="US" checked> <img src="images/flag-us.png" class="flag" alt="American"></label>
    <label><input type="radio" name="accent" value="GB"> <img src="images/flag-uk.png" class="flag"  alt="British"></label>
    <label><input type="radio" name="accent" value="AU"> <img src="images/flag-au.png" class="flag"  alt="Aussie"></label>
    <button type="submit" class="small" style="background-color: #EAD1DC;"><img src="images/megaphone.svg" style="width: 64px; height: 20px;" alt="Read"></button>
  </form>

  <!--
    <a href="" target="sakilingoGoogleTTS" rel="noopener noreferrer" id="readOutByGoogle">
      Read by Google with American accent
    </a>
  -->

  <table id="tsvTable"></table>

</body>

</html>
