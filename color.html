<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sakicolor</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        button.mycolor {
            padding: 6px 15px;
            font-size: 2.5vh;
            margin-left: 0px;
            margin-bottom: 3px;
            border: 2px solid gray;
            background-color: lightgray;
        }

        button.mycolorvacant {
            background: linear-gradient(135deg,
                    var(--color2) 50%,
                    var(--color1) 50%);
        }

        button.colorgrid {
            padding: 3px 15px;
            font-size: 2.5vh;
            margin-left: 0px;
            margin-bottom: 3px;
            border: 2px solid gray;
            background: linear-gradient(45deg,
                    var(--color2) 50%,
                    var(--color1) 50%);
        }

        button.colorchip {
            padding: 3px 8px;
            margin-left: 0px;
            font-size: 2.5vh;
            border: 2px solid gray;
        }

        button#shareButton {
            all: unset;
            color: #06c;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <script type="module" src="color-script.js"></script>

    <div id="myColorsDiv"></div>
    <hr>

    <div id="picker">
        <div id="colorGridButtons1"></div>
        <div id="colorGridButtons2"></div>
        <div id="colorGridButtons3"></div>
        <hr>
        <div id="colorGrids1"></div>
        <div id="colorGrids2"></div>
        <div id="colorGrids3"></div>
        <hr>
        <button id="shareButton" type="button" class="link">Share my palette!</button>
    </div>

    <div id="viewer">
        <a href="./color.html">Create more beautiful palettes :)</a>
    </div>
</body>

</html>
